<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>إدارة عيادة د. مصطفى كمال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: fixed side rail of sections + wide work area; tables and lists over cards, colour only for clinical state */
:root{
  --bg:#EDF2F2; --surface:#FFFFFF; --sunk:#F4F7F7; --ink:#12262D; --muted:#586C73; --line:#D6E1E2;
  --accent:#0C6F7B; --accent-ink:#FFFFFF; --accent-soft:#D9EDEF; --rail:#0F2A31; --rail-ink:#CFE1E3; --rail-hi:#1B3E46;
  --ok:#2B7A4B; --ok-soft:#DFF1E5; --warn:#9A5F0C; --warn-soft:#FAEDD6; --danger:#B0341A; --danger-soft:#FAE2DB; --violet:#5B4BB0; --violet-soft:#E7E3F8;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1518; --surface:#122126; --sunk:#0E1B1F; --ink:#E3EEF0; --muted:#93A8AE; --line:#24373D;
  --accent:#4FB7C3; --accent-ink:#06282D; --accent-soft:#16363C; --rail:#081114; --rail-ink:#A9C2C6; --rail-hi:#163238;
  --ok:#6CC892; --ok-soft:#163327; --warn:#E3AA55; --warn-soft:#3A2B12; --danger:#F08A70; --danger-soft:#3C1C14; --violet:#A99BF0; --violet-soft:#2A2547; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1518; --surface:#122126; --sunk:#0E1B1F; --ink:#E3EEF0; --muted:#93A8AE; --line:#24373D;
  --accent:#4FB7C3; --accent-ink:#06282D; --accent-soft:#16363C; --rail:#081114; --rail-ink:#A9C2C6; --rail-hi:#163238;
  --ok:#6CC892; --ok-soft:#163327; --warn:#E3AA55; --warn-soft:#3A2B12; --danger:#F08A70; --danger-soft:#3C1C14; --violet:#A99BF0; --violet-soft:#2A2547; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85em}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
[dir="rtl"] .rail{padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);color:#fff;font-size:.95em;display:block;line-height:1.35}
.brand small{font-size:.75em;opacity:.75}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500}
.rail nav a:hover{background:var(--rail-hi)}
.rail nav a[aria-current="page"]{background:var(--rail-hi);color:#fff}
.rail nav a svg{width:18px;height:18px;flex:none}
.rail nav .cnt{margin-inline-start:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:.72em;padding:0 7px;font-weight:700}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.82em}
.rail .me{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--rail-hi)}
.av{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:.8em;flex:none;background:var(--accent-soft);color:var(--accent)}
.rail .av{background:var(--accent);color:var(--accent-ink)}
.rail button{background:transparent;border:1px solid var(--rail-hi);color:inherit;border-radius:10px;padding:6px 10px}

.work{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:4}
.bar h1{font-size:1.2em;flex:1;min-width:0}
.demo{font-size:.75em;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:2px 10px;white-space:nowrap}
.content{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:1.02em}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.grid2 > *{min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-family:var(--display);font-size:1.6em;display:block;line-height:1.2}
.stat span{color:var(--muted);font-size:.85em}

.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85em}
.icon-btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:.78em;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.plain{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}

.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-radius:12px;padding:12px 14px}
.alert.danger{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.alert.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.alert.danger .ic{background:var(--danger)}
.alert.warn .ic{background:var(--warn)}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:.78em;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{display:block}
.ltr{direction:ltr;unicode-bidi:isolate}

.sched{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:72px 4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .tm{font-family:var(--display);font-weight:600}
.slot .stripe{align-self:stretch;border-radius:4px;background:var(--line)}
.slot.s-done .stripe{background:var(--ok)}
.slot.s-chair .stripe{background:var(--accent)}
.slot.s-wait .stripe{background:var(--warn)}
.slot.s-alert .stripe{background:var(--danger)}

.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.85em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* patient file */
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.phead .av{width:56px;height:56px;font-size:1.1em}
.phead h2{font-size:1.3em}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 24px;margin:0}
.kv dt{font-size:.78em;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0}
textarea,.inp,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88em}
label.f > span.h{font-weight:400;color:var(--muted);font-size:.92em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* tooth chart (FDI) */
.chart-wrap{overflow-x:auto}
.chart{display:grid;grid-template-columns:repeat(16,minmax(38px,1fr));gap:4px;min-width:680px;direction:ltr}
.chart .mid{grid-column:1/-1;height:1px;background:var(--line);margin:6px 0;position:relative}
.chart .lab{grid-column:span 8;font-size:.72em;color:var(--muted);text-align:center}
.tooth{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78em;font-weight:600}
.tooth svg{width:22px;height:26px}
.tooth.st-caries{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.tooth.st-filling{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tooth.st-rct{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tooth.st-crown{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.tooth.st-implant{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tooth.st-extracted{background:var(--sunk);border-style:dashed;color:var(--muted)}
.tooth.st-extracted svg{opacity:.25}
.tooth.st-planned{border:2px dashed var(--warn);color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82em}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}

.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.xray{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#050607;margin:0}
.xray canvas,.xray img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:16/9;object-fit:cover}
.xray figcaption{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:.88em}
.drop{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);min-height:160px;cursor:pointer}
.drop input{display:none}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.dotc{width:10px;height:10px;border-radius:99px;background:var(--line)}
.dotc.ok{background:var(--ok)}.dotc.next{background:var(--accent)}.dotc.plan{background:var(--warn)}

/* inbox */
.q{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q.emergency{border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:var(--danger-soft)}
.q .bubble{background:var(--sunk);border-radius:12px;padding:10px 12px}
.q.emergency .bubble{background:var(--surface)}
.q .why{font-size:.82em;color:var(--warn);font-weight:600}
.q.emergency .why{color:var(--danger)}
.convo{display:flex;flex-direction:column;gap:8px}
.convo .m{max-width:78%;padding:8px 12px;border-radius:12px}
.convo .m.p{align-self:flex-start;background:var(--sunk)}
.convo .m.a{align-self:flex-end;background:var(--accent-soft)}
.convo .meta{font-size:.75em;color:var(--muted)}

/* team matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.matrix input{width:18px;height:18px;accent-color:var(--accent)}

/* templates */
.tpl{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.tpl-list button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px 12px;border-radius:10px}
.tpl-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,15,18,.5);z-index:50;display:grid;place-items:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal h2{font-size:1.1em}
.warnbox{background:var(--danger-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.warnbox b{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:.92em;max-width:90vw}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;direction:ltr;user-select:all;overflow-wrap:anywhere;min-width:0;flex:1}

@media (max-width:980px){
  .grid2,.tpl{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  [dir="rtl"] .rail{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .rail nav a{white-space:nowrap;padding:7px 10px}
  .rail .foot{display:none}
  .bar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form{grid-template-columns:1fr}
  .phead{grid-template-columns:auto 1fr}
  .phead .acts{grid-column:1/-1}
  .slot{grid-template-columns:60px 4px 1fr}
  .slot > :last-child{grid-column:3}
}
</style>
</head>
<body>


<div id="root"></div>

<script>
(function(){
const PATIENT_APP_URL=new URL('../patient/',location.href).href;
/* ---------- dates & helpers ---------- */
const now=new Date();const today=new Date(now);today.setHours(0,0,0,0);
const day=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d};
const A={lang:'ar',ptab:'file',filter:'all',q:'',inboxTab:'pending',tpl:'extraction',modal:null};
try{const s=JSON.parse(localStorage.getItem('mk-admin')||'{}');if(s.lang)A.lang=s.lang}catch(e){}
const save=()=>{try{localStorage.setItem('mk-admin',JSON.stringify({lang:A.lang}))}catch(e){}};
const L=o=>o==null?'':typeof o==='string'?o:(o[A.lang]??o.ar);
const loc=()=>A.lang==='ar'?'ar-IQ-u-nu-latn':'en-GB';
const fd=(d,o)=>d?d.toLocaleDateString(loc(),o||{day:'numeric',month:'short',year:'numeric'}):'—';
function ft(t){let [h,m]=t.split(':').map(Number);const pm=h>=12;return `${h%12||12}:${String(m).padStart(2,'0')} ${A.lang==='ar'?(pm?'م':'ص'):(pm?'PM':'AM')}`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>{const p=L(n).split(' ');return (p[0]?.[0]||'')+(p[1]?.[0]||'')};
const ago=min=>A.lang==='ar'?(min<60?`قبل ${min} دقيقة`:`قبل ${Math.round(min/60)} ساعة`):(min<60?`${min} min ago`:`${Math.round(min/60)} h ago`);
let uid=100;

/* ---------- demo data ---------- */
const CLINIC={name:{ar:'عيادة الدكتور مصطفى كمال',en:'Dr. Mustafa Kamal Dental Clinic'},sub:{ar:'طب وتجميل الأسنان',en:'Dentistry'},
  address:{ar:'بغداد، الأعظمية، شارع عمر بن عبد العزيز، قرب جامع أبي حنيفة، الطابق الأول',en:'1st floor, Omar bin Abdulaziz St., near Abu Hanifa Mosque, Al-Adhamiya, Baghdad'},
  phone:'0770 980 4412',wa:'0770 980 4412',hours:{ar:'السبت إلى الخميس، 4:00 م إلى 10:00 م',en:'Saturday to Thursday, 4:00 PM to 10:00 PM'}};
const DOCS={mk:{ar:'د. مصطفى كمال',en:'Dr. Mustafa Kamal'},sn:{ar:'د. سارة ناظم',en:'Dr. Sara Nadhim'}};

const PATIENTS=[
 {id:1,name:{ar:'أحمد علي حسن',en:'Ahmed Ali Hassan'},sex:'m',age:34,phone:'0770 123 4567',ch:'app',blood:'O+',file:'MK-0142',status:'followup',last:-1,
  conditions:[],allergies:[],pregnant:false,current:[],ec:{ar:'علي حسن (الأب) · 0771 555 2310',en:'Ali Hassan (father) · 0771 555 2310'},
  notes:{ar:'قلع جراحي لضرس العقل 38 (مطمور جزئياً). العملية بدون مضاعفات، 3 غرز. المريض متعاون. تسوس عميق في 16 يحتاج عصب.',en:'Surgical extraction of 38 (partially impacted). Uneventful, 3 sutures. Cooperative patient. Deep caries on 16 needs root canal.'},
  teeth:{38:'extracted',16:'planned',26:'filling',47:'filling',37:'caries'},

const TEMPLATES={
 extraction:{t:{ar:'ما بعد القلع',en:'After an extraction'},body:{ar:'اعضّ على الشاش 30 دقيقة.\nلا تمضمض ولا تبصق ولا تستخدم الشفاطة أول 24 ساعة.\nكمادات باردة أول يوم.\nأكل بارد وناعم أول يوم.\nمن اليوم الثاني: مضمضة بماء وملح بعد الأكل.\nلا تدخين 72 ساعة على الأقل.\nاتصل فوراً إذا النزيف ما وقف بعد 30 دقيقة ضغط.',en:'Bite on gauze for 30 minutes.\nNo rinsing, spitting or straws for 24 hours.\nCold packs on day one.\nCold, soft food on day one.\nFrom day 2: salt-water rinse after meals.\nNo smoking for at least 72 hours.\nCall straight away if bleeding does not stop after 30 minutes of pressure.'}},
 rct:{t:{ar:'علاج العصب',en:'Root canal'},body:{ar:'لا تاكل لحد ما يروح التخدير.\nامضغ على الجهة الثانية لحد التاج.\nألم خفيف 2 إلى 3 أيام طبيعي.\nالحشوة المؤقتة ممكن تنقص شوية، إذا طاحت كلها اتصل بينا.',en:'Do not eat until the numbness wears off.\nChew on the other side until the crown is fitted.\nMild pain for 2 to 3 days is normal.\nThe temporary filling may wear slightly; call us if it falls out.'}},
 filling:{t:{ar:'ما بعد الحشوة',en:'After a filling'},body:{ar:'الحشوة التجميلية تقدر تاكل عليها بعد ما يروح التخدير.\nحساسية خفيفة للبارد طبيعية لأسبوع أو أسبوعين.\nإذا العضة حاسها عالية، راجعنا لتعديلها.',en:'You can eat on a composite filling once the numbness wears off.\nMild cold sensitivity is normal for one to two weeks.\nIf your bite feels high, come back to adjust it.'}},
 implant:{t:{ar:'ما بعد الزراعة',en:'After an implant'},body:{ar:'لا تدخين أبداً لأسبوعين على الأقل.\nأكل ناعم أسبوع، وامضغ على الجهة الثانية.\nكمادات باردة أول 48 ساعة.\nكمّل المضاد الحيوي للآخر.',en:'No smoking at all for at least two weeks.\nSoft food for a week, chewing on the other side.\nCold packs for the first 48 hours.\nFinish the full antibiotic course.'}},
 ortho:{t:{ar:'التقويم',en:'Braces'},body:{ar:'المطاط 22 ساعة باليوم، وبدّله كل يوم.\nابتعد عن العلك والأكل اللزج والقاسي.\nنظّف بين السلوك بالفرشاة الصغيرة بعد كل أكلة.\nإذا انكسر براكت، اتصل لتحديد موعد.',en:'Wear elastics 22 hours a day and change them daily.\nAvoid gum, sticky and hard food.\nClean between the wires with the small brush after every meal.\nIf a bracket breaks, call to book a visit.'}},

/* ---------- synthetic X-ray ---------- */
function rng(seed){let s=seed*9973%233280;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function drawTooth(c,x,yOcc,w,len,dir,fill){const g=c.createLinearGradient(0,yOcc,0,yOcc+dir*len);g.addColorStop(0,'rgba(235,238,240,.95)');g.addColorStop(.28,'rgba(200,205,208,.85)');g.addColorStop(1,'rgba(120,126,130,.35)');c.fillStyle=g;rr(c,x-w/2,dir>0?yOcc:yOcc-len,w,len,w*.35);c.fill();c.fillStyle='rgba(40,44,46,.55)';const cw=w*.18;rr(c,x-cw/2,dir>0?yOcc+len*.3:yOcc-len*.92,cw,len*.62,cw/2);c.fill();if(fill){c.fillStyle='rgba(255,255,255,.98)';rr(c,x-w*.28,dir>0?yOcc+2:yOcc-len*.22,w*.56,len*.2,4);c.fill()}}
function drawXray(cv,x,teeth){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,r=rng(x.seed||5);
  c.fillStyle='#050607';c.fillRect(0,0,W,H);const g=c.createRadialGradient(W/2,H/2,10,W/2,H/2,W*.65);g.addColorStop(0,'rgba(110,118,122,.55)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  try{c.filter='blur(1.2px)'}catch(e){}
  if(x.type==='pano'){
    c.strokeStyle='rgba(180,186,190,.18)';c.lineWidth=22;c.beginPath();c.ellipse(W/2,H*.2,W*.44,H*.68,0,.12*Math.PI,.88*Math.PI);c.stroke();
    const up=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],lo=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
    const n=16,span=W*.74,x0=W*.13,tw=span/n*.82;
    [up,lo].forEach((arr,row)=>arr.forEach((num,i)=>{const tt=(i+.5)/n,cx=x0+tt*span,cc=Math.pow((tt-.5)*2,2),mol=Math.abs(tt-.5)>.3;
      const st=teeth&&teeth[num];if(st==='extracted'&&x.d>-20)return;
      drawTooth(c,cx,H*.5+(row?6:-6)-cc*H*.07,mol?tw*1.12:tw*.86,(mol?H*.25:H*.3)*(.92+r()*.12),row?1:-1,st==='filling'||st==='crown'||r()>.9)}));
  }else{
    const tw=W*.2;for(let i=0;i<3;i++){const cx=W*(.24+i*.26);if((x.missing||[]).includes(i)){c.fillStyle='rgba(20,22,24,.8)';rr(c,cx-tw*.4,H*.18,tw*.8,H*.5,tw*.3);c.fill();continue}drawTooth(c,cx,H*.1,tw,H*.75,1,i===0)}
  }
  try{c.filter='none'}catch(e){}
  for(let k=0;k<1600;k++){c.fillStyle=`rgba(255,255,255,${r()*.05})`;c.fillRect(r()*W,r()*H,1.5,1.5)}
  c.fillStyle='rgba(255,255,255,.55)';c.font='13px monospace';c.fillText(x.type==='pano'?'R':'PA',12,20);
}

function patientRows(){
  const q=A.q.trim().toLowerCase();
  return PATIENTS.filter(p=>{
    if(A.filter==='follow'&&p.status!=='followup')return false;

    <div class="full row"><b class="small">${t('sendBy')}:</b><label class="check"><input type="checkbox" id="m-app" ${p.ch==='app'?'checked':''} ${p.ch==='wa'?'disabled':''}>${t('viaApp')}</label><label class="check"><input type="checkbox" id="m-wa" checked>${t('viaWa')}</label></div>
    <div class="row full"><button class="btn" type="submit">${t('send')}</button><button class="btn ghost" type="button" data-close>${t('cancel')}</button></div></form>`}
  if(m==='appt'){const pid=p?p.id:1;body=`<h2>${t('newAppt')}</h2><form id="mf" class="form">
    <label class="f full">${t('colName')}<select id="m-pid">${PATIENTS.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${L(x.name)}</option>`).join('')}</select></label>
    <label class="f">${t('date')}<input class="inp" type="date" id="m-date" required value="${day(1).toISOString().slice(0,10)}"></label>
    <label class="f">${t('time')}<input class="inp" type="time" id="m-time" required value="17:00"></label>
    <label class="f">${t('what')}<input class="inp" id="m-what" required></label>
    <label class="f">${t('doctor')}<select id="m-dr"><option value="mk">${L(DOCS.mk)}</option><option value="sn">${L(DOCS.sn)}</option></select></label>
    <label class="check full"><input type="checkbox" id="m-rem" checked>${t('remind')}</label>
    <div class="row full"><button class="btn" type="submit">${t('add')}</button><button class="btn ghost" type="button" data-close>${t('cancel')}</button></div></form>`}
  if(m==='session'&&p)body=`<h2>${t('addSession')}</h2><form id="mf" class="form">
    <label class="f full">${t('sessWhat')}<input class="inp" id="m-sw" required></label>
    <label class="f">${t('sessStatus')}<select id="m-ss"><option value="done">${t('sDone')}</option><option value="next">${t('sNext')}</option><option value="plan">${t('sPlan')}</option></select></label>
    <label class="f">${t('doctor')}<select id="m-dr"><option value="mk">${L(DOCS.mk)}</option><option value="sn">${L(DOCS.sn)}</option></select></label>
    <div class="row full"><button class="btn" type="submit">${t('add')}</button><button class="btn ghost" type="button" data-close>${t('cancel')}</button></div></form>`;
  if(m==='member')body=`<h2>${t('addMember')}</h2><form id="mf" class="form">
    <label class="f full">${t('fullName')}<input class="inp" id="m-name" required></label>
    <label class="f">${t('phone')}<input class="inp ltr" id="m-phone" required></label>
    <label class="f">${t('role')}<select id="m-role">${Object.keys(ROLES).filter(r=>r!=='owner').map(r=>`<option value="${r}">${L(ROLES[r])}</option>`).join('')}</select></label>
    <div class="row full"><button class="btn" type="submit">${t('add')}</button><button class="btn ghost" type="button" data-close>${t('cancel')}</button></div></form>`;
  if(m.startsWith&&m.startsWith('tooth:')&&p){const n=+m.split(':')[1];const s=p.teeth[n]||'healthy';body=`<h2>${t('toothN')(n)} · ${L(p.name)}</h2><form id="mf" class="form">
    <div class="full chips">${Object.keys(TOOTH).map(k=>`<label class="chip" style="display:flex;gap:6px;align-items:center"><input type="radio" name="ts" value="${k}" ${k===s?'checked':''}>${L(TOOTH[k])}</label>`).join('')}</div>
    <label class="f full">${t('toothNote')}<input class="inp" id="m-tn"></label>
    <div class="row full"><button class="btn" type="submit">${t('saveTooth')}</button><button class="btn ghost" type="button" data-close>${t('cancel')}</button></div></form>`}
  return `<div class="ov" data-close><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;
}

/* ---------- shell ---------- */
const NAV=[['today',I.today],['patients',I.users],['appointments',I.cal],['inbox',I.chat],['reminders',I.bell],['templates',I.doc],['team',I.shield],['clinic',I.gear]];
function route(){const h=(location.hash||'#today').slice(1);return h||'today'}
const root=document.getElementById('root');
function render(){
  document.documentElement.lang=A.lang;document.documentElement.dir=A.lang==='ar'?'rtl':'ltr';
  const r=route();const pid=curPid();const sec=pid?'patients':r;
  const title=pid?t('patient'):t(r)||t('today');
  const view=pid?vPatient(pid):({today:vToday,patients:vPatients,appointments:vAppts,inbox:vInbox,reminders:vReminders,templates:vTemplates,team:vTeam,clinic:vClinic}[r]||vToday)();
  root.innerHTML=`<div class="app"><aside class="rail">
    <div class="brand"><span class="mark">${I.tooth}</span><div><b>${L(CLINIC.name)}</b><small>${A.lang==='ar'?'الأعظمية، بغداد':'Al-Adhamiya, Baghdad'}</small></div></div>
    <nav>${NAV.map(([k,ic])=>`<a href="#${k}" ${sec===k?'aria-current="page"':''}>${ic}<span>${t(k)}</span>${k==='inbox'&&(pendingCount()+emCount())?`<span class="cnt num">${pendingCount()+emCount()}</span>`:''}</a>`).join('')}</nav>
    <div class="foot"><div class="me"><span class="av">مك</span><div><b style="color:#fff">${L(DOCS.mk)}</b><div>${t('owner')}</div></div></div><button data-act="lang">${t('lang')}</button></div>
  </aside><div class="work"><header class="bar">${pid?`<a href="#patients" class="icon-btn" style="display:grid;place-items:center;text-decoration:none;color:inherit" aria-label="${t('patients')}">${A.lang==='ar'?'→':'←'}</a>`:''}<h1>${title}</h1><span class="demo">${t('demo')}</span><button class="icon-btn" data-act="lang">${A.lang==='ar'?'EN':'ع'}</button></header>
  <div class="content">${view}</div></div></div>${vModal()}`;
  root.querySelectorAll('canvas[data-xp]').forEach(cv=>{const p=P(+cv.dataset.xp);drawXray(cv,p.xrays[+cv.dataset.xi],p.teeth)});
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const split=s=>s?s.split(/[,،]/).map(x=>x.trim()).filter(Boolean).map(x=>({ar:x,en:x})):[];

window.addEventListener('hashchange',()=>{A.modal=null;if(curPid()==null)A.ptab='file';render();window.scrollTo(0,0)});
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-filter],[data-ptab],[data-modal],[data-close],[data-act],[data-tooth],[data-ibtab],[data-approve],[data-handled],[data-tpl],[data-ch]');if(!el)return;
  const d=el.dataset;
  if(el.classList.contains('ov')&&e.target!==el)return;
  if(d.ibtab){A.inboxTab=d.ibtab;if(el.tagName!=='A'){render()}return}
  if(d.go){location.hash=d.go;return}
  if(d.filter){A.filter=d.filter;render();return}
  if(d.ptab){A.ptab=d.ptab;render();return}
  if(d.modal){A.modal=d.modal;A.careTpl=null;render();const f=document.querySelector('.modal input,.modal select');f&&f.focus();return}
  if('close' in d){A.modal=null;render();return}
  if(d.tooth){A.modal='tooth:'+d.tooth;render();return}
  if(d.tpl){A.tpl=d.tpl;render();return}
  if(d.ch){const p=P(curPid());p.ch=d.ch;render();toast(t('saved'));return}
  if(d.approve){const i=INBOX.find(x=>x.id===+d.approve);const txt=val('draft-'+i.id);i.kind='auto';i.a={ar:txt,en:txt};i.src={ar:'رد الطبيب',en:"Doctor's reply"};render();toast(t('answered'));return}
  if(d.handled){INBOX=INBOX.filter(x=>x.id!==+d.handled);const a=APPTS.find(x=>x.pid===4&&x.d===0);if(a)a.st='wait';render();toast(t('saved'));return}
  const a=d.act;
  if(a==='lang'){A.lang=A.lang==='ar'?'en':'ar';save();render()}
  else if(a==='saveNotes'){const p=P(+d.id);const v=val('notes');p.notes={ar:v,en:v};toast(t('saved'))}
  else if(a==='saveTpl'){const c=TEMPLATES[A.tpl];c.t={...c.t,[A.lang]:val('tplT')};c.body={...c.body,[A.lang]:document.getElementById('tplB').value};render();toast(t('saved'))}
  else if(a==='newTpl'){const k='t'+(uid++);TEMPLATES[k]={t:{ar:'نموذج جديد',en:'New template'},body:{ar:'',en:''}};A.tpl=k;render()}
  else if(a==='saveClinic'){CLINIC.name={...CLINIC.name,[A.lang]:val('cName')};CLINIC.address={...CLINIC.address,[A.lang]:val('cAddr')};CLINIC.phone=val('cPhone');CLINIC.wa=val('cWa');CLINIC.hours={...CLINIC.hours,[A.lang]:val('cHours')};render();toast(t('saved'))}
  else if(a==='copyLink'){const s=PATIENT_APP_URL;if(!s)return;try{navigator.clipboard.writeText(s).then(()=>toast(t('copied')),()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('plink'));getSelection().removeAllRanges();getSelection().addRange(r)})}catch(err){}}
});
root.addEventListener('input',e=>{
  if(e.target.id==='search'){A.q=e.target.value;document.getElementById('prows').innerHTML=patientRows()}
  if(e.target.id==='m-med'){const p=P(curPid());document.getElementById('mwarn').innerHTML=warnHtml(medWarnings(p,e.target.value))}
});
root.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='m-tpl'){A.careTpl=el.value;document.getElementById('tplprev').textContent=L(TEMPLATES[el.value].body)}
  if(el.dataset.perm){const [id,k]=el.dataset.perm.split('|');TEAM.find(m=>m.id===+id).p[k]=el.checked?1:0;toast(t('saved'))}
  if(el.dataset.role){const m=TEAM.find(x=>x.id===+el.dataset.role);m.role=el.value;m.p={...PRESET[el.value]};render();toast(t('saved'))}
  if(el.dataset.rule){AI.rules[el.dataset.rule]=el.checked;toast(t('saved'))}
  if(el.id==='aiAuto'){AI.auto=el.checked;toast(t('saved'))}
  if(el.id==='xup'&&el.files[0]){const p=P(+el.dataset.id);const fr=new FileReader();fr.onload=()=>{p.xrays.unshift({type:'photo',d:0,img:fr.result,note:{ar:'مرفوعة اليوم',en:'Uploaded today'}});render();toast(t('added'))};fr.readAsDataURL(el.files[0])}
});
root.addEventListener('submit',e=>{
  e.preventDefault();const m=A.modal;const p=P(curPid());
  if(m==='patient'){const id=uid++;const name=val('m-name');PATIENTS.unshift({id,name:{ar:name,en:name},sex:val('m-sex'),age:+val('m-age'),phone:val('m-phone'),ch:val('m-ch'),blood:'—',file:'MK-0'+(157+id-100),status:'active',last:0,conditions:split(val('m-cond')),allergies:split(val('m-all')),pregnant:false,current:[],ec:'—',notes:{ar:'',en:''},teeth:{},xrays:[],sessions:[],meds:[],sent:[]});A.modal=null;toast(t('added'));location.hash='p-'+id;render();return}
  if(m==='med'){const name=val('m-med');const w=medWarnings(p,name);if(w.length&&!document.getElementById('warnOk')?.checked){document.getElementById('mwarn').innerHTML=warnHtml(w);document.getElementById('mwarn').scrollIntoView({block:'center'});return}
    const prn=document.getElementById('m-prn').checked;const n=+val('m-n');const tm={1:['09:00'],2:['09:00','21:00'],3:['07:00','15:00','23:00'],4:['08:00','14:00','20:00','02:00']}[n];
    p.meds.push({name,how:{ar:val('m-how'),en:val('m-how')},times:prn?[]:tm,prn,days:+val('m-days')||1,start:0});
    if(!prn)tm.forEach(x=>{if(x>='16:00')REMINDERS.push({pid:p.id,d:0,t:x,w:{ar:name,en:name},ch:p.ch==='wa'?['wa']:['app','wa'],st:'scheduled'})});
    A.modal=null;A.ptab='meds';render();toast(t('added'));return}
  if(m==='care'){const k=val('m-tpl');if(!p.sent.includes(k))p.sent.push(k);const ch=[];if(document.getElementById('m-app')?.checked)ch.push('app');if(document.getElementById('m-wa').checked)ch.push('wa');
    REMINDERS.push({pid:p.id,d:0,t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,w:TEMPLATES[k].t,ch:ch.length?ch:['wa'],st:'sent'});A.modal=null;A.ptab='care';render();toast(t('sent'));return}
  if(m==='appt'){const pid=+val('m-pid');const dd=new Date(val('m-date'));dd.setHours(0,0,0,0);const off=Math.round((dd-today)/864e5);const w=val('m-what');
    APPTS.push({id:uid++,pid,d:off,t:val('m-time'),w:{ar:w,en:w},dr:val('m-dr'),st:'booked'});
    if(document.getElementById('m-rem').checked)REMINDERS.push({pid,d:off-1,t:'18:00',w:{ar:`تذكير بموعد: ${w}`,en:`Appointment reminder: ${w}`},ch:P(pid).ch==='wa'?['wa']:['app','wa'],st:'scheduled'});
    P(pid).sessions.push({d:off,s:'next',t:{ar:w,en:w},dr:val('m-dr')});A.modal=null;render();toast(t('added'));return}
  if(m==='session'){const w=val('m-sw');p.sessions.push({d:val('m-ss')==='plan'?null:0,s:val('m-ss'),t:{ar:w,en:w},dr:val('m-dr')});A.modal=null;render();toast(t('added'));return}
  if(m==='member'){const r=val('m-role');const nm=val('m-name');TEAM.push({id:uid++,name:{ar:nm,en:nm},phone:val('m-phone'),role:r,p:{...PRESET[r]}});A.modal=null;render();toast(t('added'));return}
  if(m&&m.startsWith('tooth:')){const n=+m.split(':')[1];const s=document.querySelector('input[name="ts"]:checked').value;if(s==='healthy')delete p.teeth[n];else p.teeth[n]=s;A.modal=null;render();toast(t('saved'));return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&A.modal){A.modal=null;render()}});
render();
})();
</script>
