<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تطبيق مرضى د. مصطفى كمال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, bottom tab bar; cards only for things the patient acts on */
:root{
  --bg:#EAF1F1; --surface:#FFFFFF; --sunk:#F3F7F7; --ink:#12262D; --muted:#586C73; --line:#D6E1E2;
  --accent:#0C6F7B; --accent-ink:#FFFFFF; --accent-soft:#D9EDEF;
  --ok:#2B7A4B; --ok-soft:#DFF1E5; --warn:#9A5F0C; --warn-soft:#FAEDD6; --danger:#B0341A; --danger-soft:#FAE2DB;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --fs:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1619; --surface:#132227; --sunk:#0F1C20; --ink:#E3EEF0; --muted:#93A8AE; --line:#24373D;
  --accent:#4FB7C3; --accent-ink:#06282D; --accent-soft:#16363C;
  --ok:#6CC892; --ok-soft:#163327; --warn:#E3AA55; --warn-soft:#3A2B12; --danger:#F08A70; --danger-soft:#3C1C14; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1619; --surface:#132227; --sunk:#0F1C20; --ink:#E3EEF0; --muted:#93A8AE; --line:#24373D;
  --accent:#4FB7C3; --accent-ink:#06282D; --accent-soft:#16363C;
  --ok:#6CC892; --ok-soft:#163327; --warn:#E3AA55; --warn-soft:#3A2B12; --danger:#F08A70; --danger-soft:#3C1C14; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.65}
body.big{--fs:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.shell{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:520px){.shell{border-inline:1px solid var(--line);box-shadow:0 0 0 1px var(--line)}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:.95em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.78em;display:block}
.icon-btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;height:36px;min-width:36px;padding:0 8px;display:grid;place-items:center;position:relative;font-weight:600;font-size:.82em}
.dot{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--danger);color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

main{flex:1;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* bottom nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.74em;font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] svg{background:var(--accent-soft);border-radius:99px}
.tabs svg{width:44px;height:26px;padding:3px 10px}

/* common */
.eyebrow{font-size:.75em;letter-spacing:.04em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-family:var(--display)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title h2{font-size:1.05em}
.section-title button{border:0;background:none;color:var(--accent);font-weight:600;font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.demo-flag{font-size:.72em;color:var(--warn);background:var(--warn-soft);text-align:center;padding:4px 16px}

/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.login .mark{width:56px;height:56px;border-radius:16px}
.login h1{font-size:1.6em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9em}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1.05em;direction:ltr;text-align:start}
[dir="rtl"] .field input{text-align:right}
.err{color:var(--danger);font-size:.85em}
.wa{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:.88em}

/* home */
.hello h1{font-size:1.45em}
.recovery{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.recovery h2{font-size:1.15em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days span{height:30px;border-radius:8px;display:grid;place-items:center;font-size:.75em;font-weight:600;background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.days span.past{background:color-mix(in srgb,var(--accent-ink) 34%,transparent)}
.days span.now{background:var(--accent-ink);color:var(--accent)}
.days span.goal{outline:2px dashed color-mix(in srgb,var(--accent-ink) 60%,transparent);outline-offset:-2px}
.appt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.cal{width:62px;border-radius:12px;border:1px solid var(--line);overflow:hidden;text-align:center;background:var(--sunk)}
.cal b{display:block;background:var(--danger);color:#fff;font-size:.72em;padding:2px 0;font-weight:600}
.cal span{display:block;font-family:var(--display);font-size:1.5em;font-weight:700;padding:2px 0}

.dose{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-of-type{border-top:0}
.dose .time{font-family:var(--display);font-weight:600;min-width:64px}
.check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.dose.done .what{color:var(--muted);text-decoration:line-through}
.dose.nextup .time{color:var(--accent)}

/* meds */
.med-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.med-head h3{font-size:1em}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.88em;display:flex;gap:6px;align-items:center}
.tchip[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* care */
.phase{display:flex;flex-direction:column;gap:8px}
.phase-h{display:flex;gap:8px;align-items:center}
.phase-h h3{font-size:.98em}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules .b{width:8px;height:8px;border-radius:99px;background:var(--accent);margin-top:.6em;justify-self:center}
.phase.past{opacity:.6}
.alarm{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.alarm h3{color:var(--danger);font-size:1em}
.alarm ul{margin:0;padding-inline-start:20px}
.phone{font-family:var(--display);font-weight:700;direction:ltr;unicode-bidi:isolate;user-select:all}

/* plan */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li::before{content:"";position:absolute;inset-inline-start:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:.8em;font-weight:700;background:var(--sunk);border:2px solid var(--line);color:var(--muted)}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.next .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.xray{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#050607}
.xray canvas{display:block;width:100%;height:auto;max-width:100%}
.xray figcaption{background:var(--surface);padding:8px 10px;font-size:.82em}
.info-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92em}
.info-list dt{color:var(--muted)}
.info-list dd{margin:0}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px;display:flex;flex-direction:column;gap:8px}
.msg.bot.pending{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.msg.bot.emergency{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.msg .src{font-size:.75em;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.typing{align-self:flex-start;color:var(--muted);font-size:.85em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85em}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);border-top:1px solid var(--line)}
.composer form{max-width:460px;margin:0 auto;display:flex;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
main.chatting{padding-bottom:170px}
.note{font-size:.78em;color:var(--muted);text-align:center}

/* booking */
.dchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.dchip{flex:none;width:68px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.35}
.dchip b{font-family:var(--display);font-size:1.3em}
.dchip small{font-size:.74em;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.dchip[aria-pressed="true"] b,.dchip[aria-pressed="true"] small{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slotbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start}
.slotbtn b{font-family:var(--display)}
.slotbtn small{color:var(--muted);font-size:.8em}
.slotbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.slotbtn:disabled{opacity:.55;background:var(--sunk);cursor:not-allowed}

/* notifications sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,18,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(60px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:430px;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
.notif{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.notif:first-of-type{border-top:0}
.notif .ch{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.notif .ch.app{background:var(--accent-soft);color:var(--accent)}
.notif .ch.wa{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:.9em;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}}
</style>
</head>
<body>


<div class="shell" id="root"></div>

<script>
(function(){
/* ---------- state ---------- */
const S={lang:'ar',big:false,view:'home',taken:{},logged:false,step:'phone',err:'',chat:[],srvCount:0,draft:'',notif:false,typing:false,bk:{d:'',t:'',name:'',phone:'',err:'',ok:null}};
try{const s=JSON.parse(localStorage.getItem('mk-patient')||'{}');['lang','big','taken','logged'].forEach(k=>{if(k in s)S[k]=s[k]})}catch(e){}
function save(){try{localStorage.setItem('mk-patient',JSON.stringify({lang:S.lang,big:S.big,taken:S.taken,logged:S.logged}))}catch(e){}}

/* ---------- dates ---------- */
const now=new Date(); const today=new Date(now); today.setHours(0,0,0,0);
const day=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d};
const key=d=>d.toISOString().slice(0,10);
const loc=()=>S.lang==='ar'?'ar-IQ-u-nu-latn':'en-GB';
const fmtDate=(d,o)=>d.toLocaleDateString(loc(),o||{weekday:'long',day:'numeric',month:'long'});
function fmtTime(t){let [h,m]=t.split(':').map(Number);const pm=h>=12;let hh=h%12||12;return `${hh}:${String(m).padStart(2,'0')} ${S.lang==='ar'?(pm?'م':'ص'):(pm?'PM':'AM')}`}
const L=o=>o==null?'':typeof o==='string'?o:(o[S.lang]??o.ar);

/* ---------- bookings (shared with the clinic dashboard through localStorage) ---------- */
const BOOK={key:'mk-bookings',max:3,days:[0,1,2,3,4],startH:15,endH:21,window:21}; // Sun-Thu, 3 PM to 9 PM, 3 patients per hour
let bookings=[];
function loadBookings(){try{const a=JSON.parse(localStorage.getItem(BOOK.key)||'[]');bookings=Array.isArray(a)?a:[]}catch(e){bookings=[]}}
function saveBookings(){try{localStorage.setItem(BOOK.key,JSON.stringify(bookings))}catch(e){}}
loadBookings();
const digits=s=>String(s).replace(/\D/g,'');
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const bookingDays=()=>{const out=[];for(let i=0;i<=BOOK.window;i++){const d=day(i);if(BOOK.days.includes(d.getDay()))out.push(d)}return out};
const slotTimes=()=>Array.from({length:BOOK.endH-BOOK.startH},(_,i)=>`${String(BOOK.startH+i).padStart(2,'0')}:00`);
const slotStart=(dk,tm)=>{const [y,m,d]=dk.split('-').map(Number);const [h,mi]=tm.split(':').map(Number);return new Date(y,m-1,d,h,mi)};
const seatsLeft=(dk,tm)=>BOOK.max-bookings.filter(b=>b.date===dk&&b.time===tm).length;

/* ---------- clinic + patient data (demo) ---------- */
const CLINIC={name:{ar:'عيادة الدكتور مصطفى كمال',en:'Dr. Mustafa Kamal Dental Clinic'},sub:{ar:'طب وتجميل الأسنان · الأعظمية',en:'Dentistry · Al-Adhamiya'},
  phone:'0770 980 4412',address:{ar:'بغداد، الأعظمية، شارع عمر بن عبد العزيز، قرب جامع أبي حنيفة، الطابق الأول',en:'1st floor, Omar bin Abdulaziz St., near Abu Hanifa Mosque, Al-Adhamiya, Baghdad'},
  hours:{ar:'الأحد إلى الخميس، من 3:00 م إلى 9:00 م',en:'Sunday to Thursday, 3:00 PM to 9:00 PM'}};
const P={name:{ar:'أحمد علي حسن',en:'Ahmed Ali Hassan'},first:{ar:'أحمد',en:'Ahmed'},phone:'0770 123 4567',file:'MK-0142',
  proc:{ar:'قلع ضرس العقل السفلي الأيسر (السن 38)',en:'Lower left wisdom tooth extraction (tooth 38)'},procDay:-1,
  next:{d:day(6),t:'17:30',what:{ar:'فك الغرز والمراجعة',en:'Suture removal and check-up'},dr:{ar:'د. مصطفى كمال',en:'Dr. Mustafa Kamal'}}};
const MEDS=[
  {id:'amox',name:{ar:'أموكسيسيلين 500 ملغ',en:'Amoxicillin 500 mg'},how:{ar:'كبسولة وحدة كل 8 ساعات بعد الأكل. كمّل الكورس كامل حتى لو خف الألم.',en:'One capsule every 8 hours after food. Finish the full course even if the pain eases.'},times:['07:00','15:00','23:00'],days:5,start:-1,type:{ar:'مضاد حيوي',en:'Antibiotic'}},
  {id:'chx',name:{ar:'غسول كلورهيكسيدين 0.12%',en:'Chlorhexidine 0.12% mouthwash'},how:{ar:'مضمضة لطيفة لمدة 30 ثانية صبح ومساء، بدون بصق قوي. يبدأ من اليوم الثاني.',en:'Gentle 30-second rinse morning and evening, no forceful spitting. Starts on day 2.'},times:['09:00','21:00'],days:7,start:0,type:{ar:'غسول فم',en:'Mouthwash'}},
  {id:'ibu',name:{ar:'إيبوبروفين 400 ملغ',en:'Ibuprofen 400 mg'},how:{ar:'حبة وحدة عند الألم فقط، بعد الأكل. لا تزيد عن 3 حبات باليوم.',en:'One tablet only when in pain, after food. No more than 3 a day.'},times:[],prn:true,days:3,start:-1,type:{ar:'مسكن عند الحاجة',en:'Painkiller as needed'}}
];
const CARE=[
  {id:'h24',from:-1,to:-1,title:{ar:'أول 24 ساعة',en:'First 24 hours'},items:[

/* ---------- X-ray drawing (synthetic) ---------- */
function rng(seed){let s=seed*9973%233280;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawTooth(ctx,x,yOcc,w,len,dir,fill){
  const g=ctx.createLinearGradient(0,yOcc,0,yOcc+dir*len);g.addColorStop(0,'rgba(235,238,240,.95)');g.addColorStop(.28,'rgba(200,205,208,.85)');g.addColorStop(1,'rgba(120,126,130,.35)');
  ctx.fillStyle=g;const y=dir>0?yOcc:yOcc-len;rr(ctx,x-w/2,y,w,len,w*.35);ctx.fill();
  ctx.fillStyle='rgba(40,44,46,.55)';const cw=w*.18,cy=dir>0?yOcc+len*.3:yOcc-len*.92;rr(ctx,x-cw/2,cy,cw,len*.62,cw/2);ctx.fill();
  if(fill){ctx.fillStyle='rgba(255,255,255,.98)';const fy=dir>0?yOcc+2:yOcc-len*.22;rr(ctx,x-w*.28,fy,w*.56,len*.2,4);ctx.fill()}
}
function drawXray(cv,x){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,r=rng(x.seed);
  ctx.fillStyle='#050607';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,W*.65);g.addColorStop(0,'rgba(110,118,122,.55)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  try{ctx.filter='blur(1.2px)'}catch(e){}
  if(x.type==='pano'){
    ctx.strokeStyle='rgba(180,186,190,.18)';ctx.lineWidth=22;ctx.beginPath();ctx.ellipse(W/2,H*.2,W*.44,H*.68,0,.12*Math.PI,.88*Math.PI);ctx.stroke();
    const n=16,span=W*.74,x0=W*.13,tw=span/n*.82;
    for(let row=0;row<2;row++)for(let i=0;i<n;i++){
      const tt=(i+.5)/n,cx=x0+tt*span,c=Math.pow((tt-.5)*2,2),mol=Math.abs(tt-.5)>.3;
      const yOcc=H*.5+(row?6:-6)-c*H*.07;const len=(mol?H*.25:H*.3)*(0.92+r()*.12);const w=mol?tw*1.12:tw*.86;
      if(row===1&&i===15&&x.extracted)continue;
      drawTooth(ctx,cx,yOcc,w,len,row?1:-1,r()>.84);
    }
  }else{
    const n=3,tw=W*.22;
    for(let i=0;i<n;i++){const cx=W*(.22+i*.28);if(x.missing.includes(i)){ctx.fillStyle='rgba(20,22,24,.8)';rr(ctx,cx-tw*.4,H*.18,tw*.8,H*.5,tw*.3);ctx.fill();continue}
      drawTooth(ctx,cx,H*.12,tw,H*.7,1,i===0)}
  }
  try{ctx.filter='none'}catch(e){}
  for(let k=0;k<1400;k++){ctx.fillStyle=`rgba(255,255,255,${r()*.05})`;ctx.fillRect(r()*W,r()*H,1.5,1.5)}
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='12px monospace';ctx.fillText(x.type==='pano'?'R':'38',10,18);
}

function bookSubmit(){
  const name=S.bk.name.trim(),ph=digits(S.bk.phone),d=S.bk.d,tm=S.bk.t;let err='';
  if(!d||!tm)err=bt('needSlot');
  else if(!name)err=bt('needName');
  else if(ph.length<10)err=bt('needPhone');
  else if(slotStart(d,tm)<=new Date())err=bt('passed');
  else if(seatsLeft(d,tm)<=0)err=bt('full');
  else if(bookings.some(b=>b.date===d&&b.time===tm&&digits(b.phone)===ph))err=bt('dup');
  if(err){S.bk.err=err;render();return}
  bookings.push({id:`b${Date.now()}${Math.floor(Math.random()*1000)}`,date:d,time:tm,name,phone:S.bk.phone.trim(),by:digits(P.phone),at:new Date().toISOString(),seen:false});
  saveBookings();
  S.bk.ok={date:d,time:tm,name};S.bk.err='';render();
}

/* ---------- chat logic (simulated) ---------- */
function classify(q){
  const s=q.toLowerCase().replace(/[أإآ]/g,'ا');const w=s.split(/[\s،,.?؟!]+/);
  const has=a=>a.some(k=>s.includes(k));
  if(has(['نزيف','ينزف','نزف','الدم','تورم','منتفخ','انتفاخ','ورم','حراره','حرارة','سخونه','سخونة','تنفس','البلع','ابلع','صديد','قيح','bleed','blood','swell','fever','breath','swallow','pus'])||w.includes('دم'))return 'emergency';
  if(has(['جرعه','جرعة','حبتين','اضاعف','ازيد','اوقف','اقطع','ابدل','dose','double','two ibuprofen','stop taking','extra']))return 'pending';
  if(has(['اكل','طعام','eat','food']))return 'eat';
  if(has(['الم','يوجع','وجع','pain','hurt']))return 'pain';
  if(has(['دخن','تدخين','سيكاره','سيجاره','اركيله','smok','cigar']))return 'smoke';
  if(has(['مضمض','غسول','ملح','rinse','mouthwash']))return 'rinse';
  if(has(['فرش','فرشاه','فرشاة','brush']))return 'brush';
  if(has(['شفاط','ماصه','ماصة','straw']))return 'straw';
  if(has(['رياض','نادي','جيم','sport','gym','exercise']))return 'sport';
  if(has(['موعد','مراجعه','مراجعة','غرز','appointment','stitch','suture']))return 'appt';
  return 'unknown';
}
function reply(q){
  const c=classify(q),A=t('ans');let kind='ok',text;
  if(c==='emergency'){kind='emergency';text=A.emergency(CLINIC.phone)}
  else if(c==='pending'){kind='pending';text=A.pending}
  else if(c==='unknown'){kind='pending';text=A.unknown}
  else if(c==='appt'){text=A.appt(`${fmtDate(P.next.d)} ${fmtTime(P.next.t)}`)}
  else text=A[c];
  return {who:'bot',kind,text};
}
/* The clinic server (server/server.mjs) serves this page, so the API is on the same address.
   The conversation lives on the server: it is reloaded on every sync, and doctor replies arrive through it. */
const OFFLINE={ar:'المساعد غير متصل الآن. أرسل سؤالك للعيادة على الرقم: '+CLINIC.phone,en:'The assistant is offline. Please contact the clinic: '+CLINIC.phone};
async function syncChat(){
  if(!S.logged)return;
  try{
    const r=await fetch(`/api/patients/${encodeURIComponent(P.file)}/messages?after=0`,{cache:'no-store'});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    const changed=j.messages.length!==S.srvCount;
    S.srvCount=j.messages.length;
    S.chat=j.messages.map(m=>({who:m.role==='patient'?'me':'bot',kind:m.kind,text:m.text}));
    if(changed)render();
  }catch(e){}
}
async function ask(q){
  q=q.trim();if(!q||S.typing)return;S.chat.push({who:'me',text:q});S.typing=true;render();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:P.file,message:q})});
    if(!r.ok)throw new Error('http '+r.status);
    await r.json();
  }catch(e){S.chat.push({who:'bot',kind:'plain',text:L(OFFLINE)})}
  S.typing=false;
  await syncChat();
  render();
}
setInterval(syncChat,4000);

/* ---------- render ---------- */
const root=document.getElementById('root');
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('big',S.big);
  if(!S.logged){root.innerHTML=vLogin();return}
  const v={home:vHome,meds:vMeds,care:vCare,plan:vPlan,chat:vChat,book:vBook}[S.view]||vHome;
  const qEl=document.getElementById('q');if(qEl)S.draft=qEl.value;   // keep what the patient is typing
  root.innerHTML=header()+`<main class="${S.view==='chat'?'chatting':''}">${v()}</main>`+nav()+vNotif();
  const qNew=document.getElementById('q');if(qNew)qNew.value=S.draft;
  root.querySelectorAll('canvas[data-x]').forEach(cv=>{const x=XRAYS[+cv.dataset.x];drawXray(cv,{...x,extracted:x.type==='pano'?false:true})});
  if(S.view==='chat'){window.scrollTo(0,document.body.scrollHeight)}
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

root.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-view],[data-dose],[data-prn],[data-sugg],[data-bday],[data-btime]');if(!el)return;
  if(el.classList.contains('sheet-bg')&&e.target!==el)return;
  if(el.dataset.view){S.view=el.dataset.view;S.notif=false;render();window.scrollTo(0,0);if(S.view==='chat')window.scrollTo(0,document.body.scrollHeight);return}
  if(el.dataset.dose){const id=el.dataset.dose;S.taken[id]=!S.taken[id];save();render();return}
  if(el.dataset.prn){const k=`${key(today)}|${el.dataset.prn}|prn`;S.taken[k]=(S.taken[k]||0)+1;save();render();return}
  if(el.dataset.sugg){ask(el.dataset.sugg);return}
  if(el.dataset.bday){S.bk.d=el.dataset.bday;S.bk.t='';S.bk.err='';render();return}
  if(el.dataset.btime){S.bk.t=el.dataset.btime;S.bk.err='';render();return}
  const a=el.dataset.act;
  if(a==='lang'){S.lang=S.lang==='ar'?'en':'ar';save();render()}
  else if(a==='big'){S.big=!S.big;save();render()}
  else if(a==='notif'){S.notif=!S.notif;render()}
  else if(a==='back'){S.step='phone';S.err='';render()}
  else if(a==='logout'){S.logged=false;S.step='phone';save();render()}
  else if(a==='bookAgain'){S.bk.ok=null;S.bk.t='';S.bk.err='';render()}
  else if(a==='copy'){const p=CLINIC.phone;try{navigator.clipboard.writeText(p).then(()=>toast(t('copied')),()=>toast(p))}catch(err){toast(p)}}
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-phone'){S.step='code';S.err='';render();setTimeout(()=>{const c=document.getElementById('cd');c&&c.focus()},50)}
  else if(e.target.id==='f-code'){const v=document.getElementById('cd').value.trim();if(v==='1234'){S.logged=true;S.step='phone';S.view='home';save();render();syncChat()}else{S.err=t('badCode');render()}}
  else if(e.target.id==='f-chat'){const q=document.getElementById('q');ask(q.value);}
  else if(e.target.id==='f-book'){bookSubmit()}
});
root.addEventListener('input',e=>{
  if(e.target.id==='bk-name')S.bk.name=e.target.value;
  else if(e.target.id==='bk-phone')S.bk.phone=e.target.value;
});
/* another tab (the clinic dashboard or another booking) changed the schedule: refresh free seats */
window.addEventListener('storage',e=>{if(e.key!==BOOK.key)return;loadBookings();if(S.view==='book'&&!S.bk.ok&&S.logged)render()});
render();
syncChat();
})();
</script>

</body>
